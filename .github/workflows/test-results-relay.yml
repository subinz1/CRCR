            -d "$PAYLOAD" --max-time 15)

          BODY=$(cat /tmp/response.txt)
          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"
          [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ] || exit 1

  # --- Scenario 4: Full multi-job pipeline (build → tests → report) ---
  pipeline-build:
    name: "Pipeline: Build"
    if: inputs.scenario == 'all' || inputs.scenario == 'multi-job-pipeline'
    runs-on: ubuntu-latest
    steps:
      - name: Mint OIDC token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken("rhel-results-relay");
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Send pipeline build callback
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          PAYLOAD="{
            \"schema_version\": 1,
            \"event_type\": \"nightly\",
            \"delivery_id\": \"pipeline-${RUN_ID}\",
            \"status\": \"completed\",
            \"conclusion\": \"success\",
            \"workflow_name\": \"Spyre Nightly: RHEL 9.6 Build & Test\",
            \"run_id\": \"${RUN_ID}\",
            \"run_attempt\": \"${RUN_ATTEMPT}\",
            \"job_name\": \"linux-rhel9.6-spyre-py3.12-x86_64 / build\"
          }"

          echo "=== Pipeline: Build ==="
          echo "Payload: $(echo "$PAYLOAD" | python3 -m json.tool)"

          HTTP_CODE=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -d "$PAYLOAD" --max-time 15)

          BODY=$(cat /tmp/response.txt)
          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"
          [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ] || exit 1

  pipeline-test-cpu:
    name: "Pipeline: CPU Tests"
    if: inputs.scenario == 'all' || inputs.scenario == 'multi-job-pipeline'
    needs: pipeline-build
    runs-on: ubuntu-latest
    steps:
      - name: Mint OIDC token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken("rhel-results-relay");
            core.setSecret(token);
