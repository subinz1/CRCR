name: Test Results Relay Lambda

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Test scenario to run"
        required: true
        type: choice
        default: all
        options:
          - all
          - build-success
          - build-failure
          - test-mixed
          - multi-job-pipeline

permissions:
  contents: read
  id-token: write

env:
  CALLBACK_URL: https://hg21hqq0r6.execute-api.us-east-1.amazonaws.com/default/crcr-rhel-workflow

jobs:

  # --- Scenario 1: Successful build ---
  build-success:
    name: "Scenario: Build Success"
    if: inputs.scenario == 'all' || inputs.scenario == 'build-success'
    runs-on: ubuntu-latest
    steps:
      - name: Mint OIDC token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken("rhel-results-relay");
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Send build success callback
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          PAYLOAD="{
            \"schema_version\": 1,
            \"event_type\": \"nightly\",
            \"delivery_id\": \"build-success-${RUN_ID}\",
            \"status\": \"completed\",
            \"conclusion\": \"success\",
            \"workflow_name\": \"CRCR Nightly: RHEL 9.6 Build & Test\",
            \"run_id\": \"${RUN_ID}\",
            \"run_attempt\": \"${RUN_ATTEMPT}\",
            \"job_name\": \"linux-rhel9.6-cuda13.0-py3.12-gcc11-x86_64 / build\"
          }"

          echo "=== Scenario: Build Success ==="
          echo "Payload: $(echo "$PAYLOAD" | python3 -m json.tool)"

          HTTP_CODE=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -d "$PAYLOAD" --max-time 15)

          BODY=$(cat /tmp/response.txt)
          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"
          [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ] || exit 1

  # --- Scenario 2: Build failure ---
  build-failure:
    name: "Scenario: Build Failure"
    if: inputs.scenario == 'all' || inputs.scenario == 'build-failure'
    runs-on: ubuntu-latest
    steps:
      - name: Mint OIDC token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken("rhel-results-relay");
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Send build failure callback
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          PAYLOAD="{
            \"schema_version\": 1,
            \"event_type\": \"nightly\",
            \"delivery_id\": \"build-fail-${RUN_ID}\",
            \"status\": \"completed\",
            \"conclusion\": \"failure\",
            \"workflow_name\": \"CRCR Nightly: RHEL 9.6 Build & Test\",
            \"run_id\": \"${RUN_ID}\",
            \"run_attempt\": \"${RUN_ATTEMPT}\",
            \"job_name\": \"linux-rhel9.6-cuda13.0-py3.12-gcc11-x86_64 / build\"
          }"

          echo "=== Scenario: Build Failure ==="
          echo "Payload: $(echo "$PAYLOAD" | python3 -m json.tool)"

          HTTP_CODE=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -d "$PAYLOAD" --max-time 15)

          BODY=$(cat /tmp/response.txt)
          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"
          [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ] || exit 1

  # --- Scenario 3: Mixed test results (some pass, some fail) ---
  test-cpu-pass:
    name: "Scenario: CPU Test Pass"
    if: inputs.scenario == 'all' || inputs.scenario == 'test-mixed'
    runs-on: ubuntu-latest
    steps:
      - name: Mint OIDC token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken("rhel-results-relay");
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Send CPU test success callback
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          PAYLOAD="{
            \"schema_version\": 1,
            \"event_type\": \"nightly\",
            \"delivery_id\": \"cpu-pass-${RUN_ID}\",
            \"status\": \"completed\",
            \"conclusion\": \"success\",
            \"workflow_name\": \"CRCR Nightly: RHEL 9.6 Build & Test\",
            \"run_id\": \"${RUN_ID}\",
            \"run_attempt\": \"${RUN_ATTEMPT}\",
            \"job_name\": \"linux-rhel9.6-cuda13.0-py3.12-gcc11-x86_64 / test (cpu, linux.rhel96)\"
          }"

          echo "=== Scenario: CPU Test Pass ==="
          echo "Payload: $(echo "$PAYLOAD" | python3 -m json.tool)"

          HTTP_CODE=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
